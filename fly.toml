# fly.toml app configuration file generated for evalloop-1458 on 2026-11-10T17:09:34+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'evalloop-1458'
primary_region = 'iad'

[build]
[env]
  COOKIE_SECURE = '1'
  DATA_DIR = '/data'
  PORT = '8080'
  SERV_BASE_URL = 'https://inference-api.openserv.ai/v1'
  SERV_MODEL = 'gpt-5.4-mini'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'evalloop_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
